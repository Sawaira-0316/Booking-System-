name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Download my code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check my code for mistakes
        run: |
          pip install ruff
          ruff check app scripts tests

      - name: Install my libraries
        run: pip install -r requirements.txt

      - name: Can the app start?
        env:
          DATABASE_URL: postgresql+psycopg2://demo:demo@localhost:5432/demo
          SECRET_KEY: ci-only-secret
        run: python -c "import app.main; print('The app can start!')"
