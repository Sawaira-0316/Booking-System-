name: CI

on: push

jobs:
  check:
    runs-on: ubuntu-latest

    # A real Postgres database, started next to the robot (fake password, throwaway).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Settings for every step below (fake values, only for the robot).
    env:
      DATABASE_URL: postgresql+psycopg2://booking:booking@localhost:5432/booking_test
      SECRET_KEY: ci-only-secret

    steps:
      - name: Download my code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check my code for mistakes
        run: |
          pip install ruff
          ruff check app scripts tests

      - name: Install my libraries
        run: pip install -r requirements.txt

      - name: Can the app start?
        run: python -c "import app.main; print('The app can start!')"

      - name: Create the database tables
        run: python -m app.db.init_db

      - name: Run the tests
        run: python -m pytest -ra

  # A second job. It runs at the same time as "check", on its own new computer.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Download my code
        uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build -t booking-api .

      - name: Start the container
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=postgresql+psycopg2://demo:demo@db:5432/demo \
            -e SECRET_KEY=ci-only-secret \
            booking-api

      - name: Ask the container "are you running?"
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "The container did not answer in 30 seconds"
          docker logs api
          exit 1
